name: CI

# When to run: on every push to any branch, and on pull requests.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    # GitHub provides a fresh Linux virtual machine for each run.
    runs-on: ubuntu-latest

    # Run the whole job once per Python version listed here, in parallel.
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # 1. Download the repository's code onto the runner.
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install the requested Python version, caching pip downloads between runs.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. Install the pinned tools (pytest, ruff).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Lint: fail the build on style/quality problems.
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      # 5. Test: fail the build if any test fails.
      - name: Run tests
        run: pytest -v
